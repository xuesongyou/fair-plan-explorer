<div style="position: relative; width: 100%; height: 380px;">
  <canvas id="c4" role="img" aria-label="Line chart of fire risk premium change 2015-2024, five categories, with Very High Fire Risk rising to over 1500 percent">Very High Fire Risk grew from 0% in 2015 to about 1551% in 2024. High Fire Risk grew to about 505%. Moderate Fire Risk grew to about 190%. Low and Very Low Fire Risk stayed flat or slightly negative.</canvas>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const years = [2015,2016,2017,2018,2019,2020,2021,2022,2023,2024];
const series = {
  'Very high fire risk': { data: [0,25,45,75,250,670,890,1085,1270,1551], color: '#e34948' },
  'High fire risk': { data: [0,0,-5,0,25,75,130,180,270,505], color: '#eda100' },
  'Moderate fire risk': { data: [0,-5,-10,-10,-10,-10,10,30,60,190], color: '#1baf7a' },
  'Low fire risk': { data: [0,-5,-10,-15,-20,-25,-30,-35,-40,-30], color: '#2a78d6' },
  'Very low fire risk': { data: [0,-10,-15,-20,-25,-30,-35,-45,-55,-50], color: '#898781' }
};
const endLabelPlugin = {
  id: 'endLabel',
  afterDatasetsDraw(chart) {
    const ctx = chart.ctx;
    ctx.save();
    ctx.font = '500 12px sans-serif';
    ctx.textBaseline = 'middle';
    Object.keys(series).forEach((key, i) => {
      const meta = chart.getDatasetMeta(i);
      const pt = meta.data[meta.data.length - 1];
      if (!pt) return;
      ctx.fillStyle = series[key].color;
      const val = series[key].data[series[key].data.length - 1];
      const sign = val > 0 ? '+' : '';
      ctx.fillText(key + ' ' + sign + val + '%', pt.x + 8, pt.y);
    });
    ctx.restore();
  }
};
new Chart(document.getElementById('c4'), {
  type: 'line',
  data: {
    labels: years,
    datasets: Object.keys(series).map(key => ({
      label: key,
      data: series[key].data,
      borderColor: series[key].color,
      backgroundColor: series[key].color,
      borderWidth: key === 'Very high fire risk' ? 3 : 2,
      pointRadius: 0,
      tension: 0.15
    }))
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    layout: { padding: { right: 130 } },
    plugins: { legend: { display: false }, tooltip: { enabled: true } },
    scales: {
      x: { grid: { display: false }, ticks: { color: '#898781', font: { size: 11 } } },
      y: {
        grid: { color: '#e1e0d9' },
        ticks: { color: '#898781', font: { size: 11 }, callback: v => v + '%' },
        title: { display: false }
      }
    }
  },
  plugins: [endLabelPlugin]
});
</script>
